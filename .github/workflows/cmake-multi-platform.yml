name: CMake (GCC)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies and build Poco
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential cmake git libssl-dev zlib1g-dev
        git clone --depth 1 --branch poco-1.15.0-release https://github.com/pocoproject/poco.git /tmp/poco
        cd /tmp/poco && mkdir -p build && cd build
        cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
        sudo cmake --build . --target install -j$(nproc)

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_PREFIX_PATH=/usr/local
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Test
      working-directory: build
      run: ctest --output-on-failure
